# HTTP → HTTPS (todo el tráfico se redirige a TLS)
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS — SPA + proxy /api/ al backend
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # SPA — todas las rutas no-archivo van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy de las llamadas del panel al backend
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoints del webhook PUI (sin prefijo /api/)
    location ~ ^/(login|activar-reporte|activar-reporte-prueba|desactivar-reporte)$ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5M;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
